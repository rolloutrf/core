name: Deploy to Yandex Cloud S3

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [data-updated]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone data repository
        run: git clone --depth 1 https://github.com/rolloutrf/data.git /tmp/rolloutrf-data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          DATA_REPO_PATH: /tmp/rolloutrf-data
        run: npm run build

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync dist/ s3://xn--80avakjqg.xn--p1ai --endpoint-url=https://storage.yandexcloud.net --delete
